[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[project]
name = "klayoutclaw"
version = "0.6.0"
description = "KLayout GUI integration for AI agents over the Model Context Protocol"
readme = "PYPI.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "gds",
    "klayout",
    "mcp",
    "nanofabrication",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []
authors = [
    { name = "caidish", email = "caidish1234@gmail.com" },
]

[project.optional-dependencies]
workers = [
    "gdstk",
    "klayout==0.30.3",
    "numpy",
    "scikit-image",
    "shapely",
]

[project.scripts]
klayoutclaw = "klayoutclaw.cli:main"

[project.urls]
Homepage = "https://github.com/caidish/KlayoutClaw"
Issues = "https://github.com/caidish/KlayoutClaw/issues"
Repository = "https://github.com/caidish/KlayoutClaw.git"

[tool.uv.build-backend]
source-include = [
    "install.py",
    "scripts/sync_payload.py",
    "plugin/*.lym",
    "plugin/klayoutclaw_vc/**",
    "tools/evaluate_worker.py",
    "tools/ordered_loop.py",
    "tools/route_worker.py",
    "tools/two_level.py",
    "tools/vc_mcp_handlers.py",
]
source-exclude = [
    "/.claude",
    "/agent",
    "/docs",
    "/tests",
    "/tests_resources",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "mcp: marks tests that require a running KLayout MCP server (deselect with '-m \"not mcp\"')",
]
